name: PR Checks

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pull Request Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HUSKY: "0"
      NEXT_PUBLIC_ENV_DOMAIN: ${{ vars.NEXT_PUBLIC_ENV_DOMAIN || 'mubmusic.com' }}
      ENV_MEDIA_ROOT_PATH: ${{ secrets.ENV_MEDIA_ROOT_PATH }}
      ENV_API_ROOT_PATH: ${{ secrets.ENV_API_ROOT_PATH }}
      ENV_API_USER: ${{ secrets.ENV_API_USER }}
      ENV_API_PASSWORD: ${{ secrets.ENV_API_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Check ESLint
        run: npm run check-lint

      - name: Run unit tests
        run: npm test

      - name: Build Next.js
        run: npm run build
