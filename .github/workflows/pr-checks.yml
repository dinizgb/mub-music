name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci

    env:
      HUSKY: "0"
      NEXT_PUBLIC_ENV_DOMAIN: ${{ vars.NEXT_PUBLIC_ENV_DOMAIN || 'mubmusic.com' }}
      ENV_MEDIA_ROOT_PATH: ${{ secrets.ENV_MEDIA_ROOT_PATH }}
      ENV_API_ROOT_PATH: ${{ secrets.ENV_API_ROOT_PATH }}
      ENV_API_USER: ${{ secrets.ENV_API_USER }}
      ENV_API_PASSWORD: ${{ secrets.ENV_API_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Ensure unique package version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          echo "PR package.json version: ${VERSION}"

          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_VERSION=$(
            git show origin/main:package.json |
              node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))"
          )
          echo "main package.json version: ${MAIN_VERSION}"

          if [ "${VERSION}" = "${MAIN_VERSION}" ]; then
            echo "::error::package.json version (${VERSION}) must differ from main for PRs into main."
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::Git tag v${VERSION} already exists. Choose a unique version."
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "::error::Git tag ${VERSION} already exists. Choose a unique version."
            exit 1
          fi

          echo "Version ${VERSION} is unique."

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Check ESLint
        run: npm run check-lint

      - name: Run unit tests
        run: npm test

      - name: Verify build env
        run: |
          missing=
          for key in ENV_API_ROOT_PATH ENV_API_USER ENV_API_PASSWORD ENV_MEDIA_ROOT_PATH NEXT_PUBLIC_ENV_DOMAIN; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required env vars:$missing"
            echo "On GitHub Environment 'ci': set NEXT_PUBLIC_ENV_DOMAIN as a Variable,"
            echo "and ENV_MEDIA_ROOT_PATH / ENV_API_* as Secrets."
            exit 1
          fi
          echo "ENV_API_ROOT_PATH=$ENV_API_ROOT_PATH"
          echo "ENV_MEDIA_ROOT_PATH=$ENV_MEDIA_ROOT_PATH"
          echo "NEXT_PUBLIC_ENV_DOMAIN=$NEXT_PUBLIC_ENV_DOMAIN"

      - name: Build Next.js
        run: npm run build
