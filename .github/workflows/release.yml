name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          echo "Creating release ${TAG} from package.json version ${VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists. Aborting release."
            exit 1
          fi

          if [ -n "${PR_BODY}" ] && [ "${PR_BODY}" != "null" ]; then
            printf '%s\n' "${PR_BODY}" > release-notes.md
          else
            printf 'Merged PR #%s: %s\n' "${PR_NUMBER}" "${PR_TITLE}" > release-notes.md
          fi

          printf '\n\n**PR:** #%s\n' "${PR_NUMBER}" >> release-notes.md

          gh release create "${TAG}" \
            --title "${PR_TITLE}" \
            --notes-file release-notes.md \
            --target "${MERGE_SHA}"
