version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10
    labels:
      - Dependencies
    commit-message:
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: sunday
    labels:
      - Dependencies
    commit-message:
      include: scope
